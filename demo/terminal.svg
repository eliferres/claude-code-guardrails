  <circle cx="48" cy="20" r="6" fill="#febc2e"/>
  <circle cx="70" cy="20" r="6" fill="#28c840"/>
  <text x="92" y="26" class="dim" font-size="14">claude-code-guardrails</text>
  <text x="24" y="72"><tspan class="p">$</tspan><tspan class="cmd" dx="8">printf '{&quot;tool_name&quot;:&quot;Bash&quot;,&quot;tool_input&quot;:{&quot;command&quot;:&quot;rm \</tspan></text>
  <text x="24" y="100" class="cmd">    -rf ./src&quot;}}' | tools/command-guard.sh; echo &quot;exit $?&quot;</text>
  <text x="24" y="128" class="bad">BLOCKED by command-guard [recursive-force-delete]: a recurs…</text>
  <text x="24" y="156" class="dim">  command: rm -rf ./src</text>
  <text x="24" y="184" class="dim">  instead: delete the named paths (rm path/one path/two), o…</text>
  <text x="24" y="212" class="dim">  If this exact command is genuinely safe here, allowlist i…</text>
  <text x="24" y="240" class="dim">  command_guard.allowlist: {&quot;rule&quot;: &quot;recursive-force-delete…</text>
  <text x="24" y="268" class="dim">  The pattern must match the whole command, so an allowlist…</text>
  <text x="24" y="296" class="dim">  command, never a shape.</text>
  <text x="24" y="324" class="dim">exit 2</text>
  <text x="24" y="352"><tspan class="p">$</tspan><tspan class="cmd" dx="8">printf '{&quot;tool_name&quot;:&quot;Bash&quot;,&quot;tool_input&quot;:{&quot;command&quot;:&quot;rm \</tspan></text>
  <text x="24" y="380" class="cmd">    -rf ./build/cache&quot;}}' | tools/command-guard.sh; echo &quot;exit \</text>
  <text x="24" y="408" class="cmd">    $?&quot;</text>
  <text x="24" y="436" class="dim">exit 0</text>
  <text x="24" y="464"><tspan class="p">$</tspan><tspan class="cmd" dx="8">printf '{&quot;tool_name&quot;:&quot;Bash&quot;,&quot;tool_input&quot;:{&quot;command&quot;:&quot;rm \</tspan></text>
  <text x="24" y="492" class="cmd">    -rf ./build/cache/objects&quot;}}' | tools/command-guard.sh; \</text>
  <text x="24" y="520" class="cmd">    echo &quot;exit $?&quot;</text>
  <text x="24" y="548" class="bad">BLOCKED by command-guard [recursive-force-delete]: a recurs…</text>
  <text x="24" y="576" class="dim">  command: rm -rf ./build/cache/objects</text>
  <text x="24" y="604" class="dim">  instead: delete the named paths (rm path/one path/two), o…</text>
  <text x="24" y="632" class="dim">  If this exact command is genuinely safe here, allowlist i…</text>
  <text x="24" y="660" class="dim">  command_guard.allowlist: {&quot;rule&quot;: &quot;recursive-force-delete…</text>
  <text x="24" y="688" class="dim">  The pattern must match the whole command, so an allowlist…</text>
  <text x="24" y="716" class="dim">  command, never a shape.</text>
