name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the suite
        run: bash tests/run-tests.sh
      - name: Prove every gate can still go red
        run: tools/liveness.sh --verbose
      - name: Install the package and run it through the installed command
        run: |
          python -m pip install .
          claude-code-guardrails --version
          claude-code-guardrails liveness --verbose
